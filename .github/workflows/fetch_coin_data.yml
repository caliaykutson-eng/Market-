name: Fetch Coin Data

on:
  schedule:
    - cron: '0 */12 * * *'  # 00:00 and 12:00 UTC
  workflow_dispatch:        # Allows manual run from the GitHub Actions UI
  push:
    branches:
      - main                # Runs on pushes to the main branch

permissions:
  contents: write           # Needed to commit the refreshed data

# One run at a time, so overlapping runs don't share CoinGecko's rate limit or race to push
concurrency:
  group: fetch-coin-data

jobs:
  fetch_coin_data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci

    - name: Run Coin Data Fetch Script
      run: node coins.cjs

    - name: Save JSON to Artifact
      uses: actions/upload-artifact@v7
      with:
        name: customCoinData
        path: customCoinData.json
        retention-days: 5

    # Pushes to the branch the run was started on
    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "Update Coin Data [bot]"
        file_pattern: customCoinData.json
        commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
